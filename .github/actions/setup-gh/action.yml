name: Setup gh
description: >-
  Makes the `gh` CLI available on PATH. GitHub-hosted runners ship it, our self-hosted ones do not,
  so fall back to unpacking the official linux-amd64 tarball into the runner tool cache.
inputs:
  version:
    description: gh CLI version to install when the runner has no gh of its own.
    required: false
    default: "2.97.0"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_CLI_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        if command -v gh >/dev/null 2>&1; then
          echo "Using pre-installed $(gh --version | head -n1)"
          exit 0
        fi

        DEST="${RUNNER_TOOL_CACHE:-${RUNNER_TEMP:-/tmp}}/gh/${GH_CLI_VERSION}"
        if [ ! -x "${DEST}/bin/gh" ]; then
          TARBALL="gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          BASE="https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          curl -fsSL -o "${WORK}/${TARBALL}" "${BASE}/${TARBALL}"
          curl -fsSL -o "${WORK}/checksums.txt" "${BASE}/gh_${GH_CLI_VERSION}_checksums.txt"
          (cd "$WORK" && grep " ${TARBALL}\$" checksums.txt | sha256sum -c -)

          rm -rf "$DEST"
          mkdir -p "$DEST"
          tar -xzf "${WORK}/${TARBALL}" -C "$DEST" --strip-components=1
        fi

        echo "${DEST}/bin" >> "$GITHUB_PATH"
        echo "Installed $("${DEST}/bin/gh" --version | head -n1)"
