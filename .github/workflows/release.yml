name: Release

# Manual: builds and publishes gyc-<major>_<version>_amd64.deb as a GitHub release asset. The
# tag is a bare <version> (no leading v), read from YMIR_VERSION's GYC_VERSION - this repo does
# not bump anything here, bootstrap is the value of truth: YMIR_VERSION only restates by hand
# whatever github.com/GNU-Ymir/bootstrap's own YMIR_VERSION says at the matching tag. Fails
# instead of overwriting if the target version has already been released, and fails fast if
# bootstrap hasn't been tagged with this version yet.
#
# Split into five jobs (checks -> clone-gcc -> build-gyc -> build-midgard -> publish) so a
# flaky/failing pass can be re-run on its own from the Actions UI ("Re-run failed jobs") without
# redoing the whole thing - most usefully, a midgard flake doesn't force redoing the expensive gcc
# compile in build-gyc, and a build-gyc flake doesn't force re-cloning gcc.gnu.org in clone-gcc.
# clone-gcc only populates the docker/Dockerfile.gyc `clone_gcc` layer (no artifact to pass along);
# build-gyc resumes from it instead of redoing it. That works with no cache-to/cache-from because
# every job here shares one persistent, on-disk BuildKit builder - see .github/actions/setup-buildx.
# Intermediate .deb artifacts hop between the other jobs as workflow artifacts.
#
# The midgard bundled is the head of YMIR_VERSION's MIDGARD_BRANCH on yruntime, not a release: a
# yruntime release is built with the gyc that bundles it, so it can only come after this one. The
# checks job marks that commit with the tag temp/<midgard version> once everything else has been
# checked; the final yruntime job removes it whatever happened, and - once this gyc is published -
# dispatches yruntime's own release on the branch, which builds midgard with this gyc, tags
# <midgard version> on that same commit and merges the branch's pull request. Every write to
# yruntime goes through the YRUNTIME_TOKEN secret (contents + actions write on GNU-Ymir/yruntime):
# this workflow's own GITHUB_TOKEN reaches no other repository.
on:
  workflow_dispatch:

permissions:
  contents: write

# Two runs in flight would fight over the same temp/<version> tag on yruntime.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    runs-on: [self-hosted, linux, x64]
    outputs:
      gcc_version: ${{ steps.version.outputs.gcc_version }}
      gcc_major_version: ${{ steps.version.outputs.gcc_major_version }}
      gyc_version_number: ${{ steps.version.outputs.gyc_version_number }}
      gyc_package_version: ${{ steps.version.outputs.gyc_package_version }}
      ymir_bootstrap_version: ${{ steps.version.outputs.ymir_bootstrap_version }}
      ymir_bootstrap_midgard_version: ${{ steps.version.outputs.ymir_bootstrap_midgard_version }}
      gyc_release_tag: ${{ steps.version.outputs.gyc_release_tag }}
      gyc_asset: ${{ steps.version.outputs.gyc_asset }}
      gyllir_version: ${{ steps.version.outputs.gyllir_version }}
      gyllir_release_tag: ${{ steps.version.outputs.gyllir_release_tag }}
      gyllir_asset: ${{ steps.version.outputs.gyllir_asset }}
      midgard_version: ${{ steps.midgard.outputs.midgard_version }}
      midgard_sha: ${{ steps.midgard.outputs.midgard_sha }}
      midgard_version_date: ${{ steps.midgard.outputs.midgard_version_date }}
      midgard_branch: ${{ steps.midgard.outputs.midgard_branch }}
      midgard_temp_tag: ${{ steps.midgard.outputs.midgard_temp_tag }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      intermediate_asset: ${{ steps.version.outputs.intermediate_asset }}
      out_asset: ${{ steps.version.outputs.out_asset }}
    steps:
      - uses: actions/checkout@v7

      # The self-hosted runners have no gh CLI of their own; the steps below need one.
      - uses: ./.github/actions/setup-gh

      - name: Compute versions and tag name
        id: version
        run: |
          . ./YMIR_VERSION
          GCC_MAJOR_VERSION="${GCC_VERSION%%.*}"
          TAG_NAME="${GYC_VERSION}"
          echo "gcc_version=${GCC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gcc_major_version=${GCC_MAJOR_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gyc_version_number=${GYC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gyc_package_version=${GYC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ymir_bootstrap_version=${YMIR_BOOTSTRAP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ymir_bootstrap_midgard_version=${YMIR_BOOTSTRAP_MIDGARD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gyc_release_tag=${YMIR_BOOTSTRAP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gyc_asset=gyc-${GCC_MAJOR_VERSION}_${YMIR_BOOTSTRAP_VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"
          echo "gyllir_version=${GYLLIR_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gyllir_release_tag=${GYLLIR_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gyllir_asset=gyllir_${GYLLIR_VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "intermediate_asset=gyc-${GCC_MAJOR_VERSION}_${TAG_NAME}_amd64.deb" >> "$GITHUB_OUTPUT"
          echo "out_asset=gyc-${GCC_MAJOR_VERSION}_${TAG_NAME}_amd64.deb" >> "$GITHUB_OUTPUT"

      # The midgard bundled: the head of MIDGARD_BRANCH (see the header, and the script for what
      # makes that branch releasable - an untagged version, this gyc in its YMIR_VERSION, an open
      # pull request).
      - name: Resolve midgard
        id: midgard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          . ./YMIR_VERSION
          bash .github/scripts/midgard-branch.sh --branch="${MIDGARD_BRANCH}" --expect-gyc="${GYC_VERSION}" --mode=release >> "$GITHUB_OUTPUT"
          echo "midgard_branch=${MIDGARD_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Ensure bootstrap has a matching tag
        env:
          TAG: ${{ steps.version.outputs.tag_name }}
        run: |
          if ! git ls-remote --exit-code --tags https://github.com/GNU-Ymir/bootstrap.git "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::github.com/GNU-Ymir/bootstrap has no tag $TAG - tag that release on bootstrap (matching its gyllir.toml version) before releasing gymir."
            exit 1
          fi

      - name: Ensure this version has not already been released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists - update YMIR_VERSION's GYC_VERSION (from bootstrap) before releasing again."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on origin (with no matching release) - update YMIR_VERSION's GYC_VERSION before releasing again."
            exit 1
          fi

      # Last, so a run that fails its checks leaves nothing on yruntime. Forced: a leftover from a
      # run whose cleanup could not reach yruntime would otherwise block every later release.
      - name: Mark the bundled midgard commit with ${{ steps.midgard.outputs.midgard_temp_tag }}
        env:
          GH_TOKEN: ${{ secrets.YRUNTIME_TOKEN }}
          TAG: ${{ steps.midgard.outputs.midgard_temp_tag }}
          SHA: ${{ steps.midgard.outputs.midgard_sha }}
        run: |
          set -euo pipefail
          if gh api "repos/GNU-Ymir/yruntime/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/GNU-Ymir/yruntime/git/refs/tags/${TAG}" -f sha="$SHA" -F force=true >/dev/null
          else
            gh api -X POST repos/GNU-Ymir/yruntime/git/refs -f ref="refs/tags/${TAG}" -f sha="$SHA" >/dev/null
          fi
          echo "GNU-Ymir/yruntime ${TAG} -> ${SHA}"

  clone-gcc:
    name: "Pass 1: clone gcc"
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-buildx

      - name: Clone upstream gcc.gnu.org (cached independently of every version knob below it)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.gyc
          target: clone_gcc
          push: false

  build-gyc:
    name: "Pass 2: build gyc"
    needs: [checks, clone-gcc]
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-buildx

      - name: Build gyc .deb (no midgard yet)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.gyc
          target: export
          push: false
          load: true
          tags: gyc-build:latest
          build-args: |
            GCC_VERSION=${{ needs.checks.outputs.gcc_version }}
            GCC_MAJOR_VERSION=${{ needs.checks.outputs.gcc_major_version }}
            COMPILER_MAJOR_VERSION=${{ needs.checks.outputs.gcc_major_version }}
            GYC_RELEASE_TAG=${{ needs.checks.outputs.gyc_release_tag }}
            GYC_ASSET=${{ needs.checks.outputs.gyc_asset }}
            YMIR_BOOTSTRAP_MIDGARD_VERSION=${{ needs.checks.outputs.ymir_bootstrap_midgard_version }}
            GYLLIR_RELEASE_TAG=${{ needs.checks.outputs.gyllir_release_tag }}
            GYLLIR_ASSET=${{ needs.checks.outputs.gyllir_asset }}
            BOOTSTRAP_RELEASE_TAG=${{ needs.checks.outputs.tag_name }}
            MIDGARD_VERSION=${{ needs.checks.outputs.midgard_version }}
            MIDGARD_VERSION_DATE=${{ needs.checks.outputs.midgard_version_date }}
            GYC_VERSION_NUMBER=${{ needs.checks.outputs.gyc_version_number }}
            GYC_PACKAGE_VERSION=${{ needs.checks.outputs.gyc_package_version }}

      - name: Extract .deb
        env:
          ASSET: ${{ needs.checks.outputs.intermediate_asset }}
        run: |
          CID="$(docker create gyc-build:latest)"
          docker cp "${CID}:/${ASSET}" "./${ASSET}"
          docker rm "${CID}"

      - uses: actions/upload-artifact@v4
        with:
          name: gyc-compiler-only-deb
          path: ${{ needs.checks.outputs.intermediate_asset }}
          retention-days: 3

  build-midgard:
    name: "Pass 3: build midgard, bundle final .deb"
    needs: [checks, build-gyc]
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: gyc-compiler-only-deb
          path: artifacts

      - name: Stage the pass-1 .deb where Dockerfile.midgard expects it
        env:
          ASSET: ${{ needs.checks.outputs.intermediate_asset }}
        run: mv "artifacts/${ASSET}" artifacts/gyc.deb

      - uses: ./.github/actions/setup-buildx

      - name: Build final gyc+midgard .deb
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.midgard
          target: export
          push: false
          load: true
          tags: gyc-midgard-build:latest
          build-args: |
            GCC_MAJOR_VERSION=${{ needs.checks.outputs.gcc_major_version }}
            MIDGARD_VERSION=${{ needs.checks.outputs.midgard_version }}
            MIDGARD_REF=${{ needs.checks.outputs.midgard_sha }}
            GYC_VERSION_NUMBER=${{ needs.checks.outputs.gyc_version_number }}
            GYC_PACKAGE_VERSION=${{ needs.checks.outputs.gyc_package_version }}
            GYLLIR_RELEASE_TAG=${{ needs.checks.outputs.gyllir_release_tag }}
            GYLLIR_ASSET=${{ needs.checks.outputs.gyllir_asset }}

      - name: Extract final .deb
        env:
          ASSET: ${{ needs.checks.outputs.out_asset }}
        run: |
          CID="$(docker create gyc-midgard-build:latest)"
          docker cp "${CID}:/${ASSET}" "./${ASSET}"
          docker rm "${CID}"

      - uses: actions/upload-artifact@v4
        with:
          name: gyc-final-deb
          path: ${{ needs.checks.outputs.out_asset }}
          retention-days: 3

  publish:
    needs: [checks, build-midgard]
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-gh

      - uses: actions/download-artifact@v4
        with:
          name: gyc-final-deb
          path: .

      # A gymir release is really a bootstrap release - the tag is bootstrap's version and this
      # repo only restates it (see the header) - so the changelog is bootstrap's, for the range
      # between the previous bootstrap release and the tag being built. gymir's own commits are
      # not listed: they carry no version of their own.
      - name: Build release notes
        env:
          TAG: ${{ needs.checks.outputs.tag_name }}
          GCC_VERSION: ${{ needs.checks.outputs.gcc_version }}
          YMIR_BOOTSTRAP_VERSION: ${{ needs.checks.outputs.ymir_bootstrap_version }}
          YMIR_BOOTSTRAP_MIDGARD_VERSION: ${{ needs.checks.outputs.ymir_bootstrap_midgard_version }}
          GYLLIR_VERSION: ${{ needs.checks.outputs.gyllir_version }}
          MIDGARD_VERSION: ${{ needs.checks.outputs.midgard_version }}
          MIDGARD_SHA: ${{ needs.checks.outputs.midgard_sha }}
        run: |
          set -euo pipefail

          CHANGELOG="${GITHUB_WORKSPACE}/.github/scripts/changelog.sh"
          CLONE="${RUNNER_TEMP}/bootstrap.git"

          # Bare + blobless: only the commit/tag metadata the changelog walks is needed, never a
          # worktree. The checks job already proved the tag is there.
          rm -rf "$CLONE"
          git clone --quiet --bare --filter=blob:none https://github.com/GNU-Ymir/bootstrap.git "$CLONE"

          # `${TAG}^`, not `${TAG}`: `git describe` of a tagged commit is that tag itself, so
          # describing its parent is what yields the *previous* release.
          BASE="$(cd "$CLONE" && bash "$CHANGELOG" --print-base --to "${TAG}^")"

          {
            echo "gyc ${TAG} (gcc ${GCC_VERSION}), built against bootstrap tag ${TAG}, compiled with gyc ${YMIR_BOOTSTRAP_VERSION} (against midgard ${YMIR_BOOTSTRAP_MIDGARD_VERSION}) and gyllir ${GYLLIR_VERSION}, bundling midgard ${MIDGARD_VERSION} (yruntime@${MIDGARD_SHA:0:7}) @ ${GITHUB_SHA}."
            echo
            if [ -n "$BASE" ]; then
              echo "## What's changed in bootstrap since ${BASE}"
            else
              echo "## What's changed in bootstrap"
            fi
            echo
            (cd "$CLONE" && bash "$CHANGELOG" --since "$BASE" --to "$TAG")
            if [ -n "$BASE" ]; then
              echo
              echo "**Full changelog**: https://github.com/GNU-Ymir/bootstrap/compare/${BASE}...${TAG}"
            fi
          } > "${RUNNER_TEMP}/release-notes.md"

          cat "${RUNNER_TEMP}/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.checks.outputs.tag_name }}
          OUT_ASSET: ${{ needs.checks.outputs.out_asset }}
        run: |
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "Release $TAG" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            "${OUT_ASSET}"

  # Runs whatever happened after the checks job created the temporary tag, so it never outlives
  # the run; hands the branch over to yruntime only once this gyc is actually published.
  yruntime:
    name: "Hand midgard over to yruntime"
    needs: [checks, build-gyc, build-midgard, publish]
    if: ${{ always() && needs.checks.result == 'success' }}
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-gh

      - name: Remove ${{ needs.checks.outputs.midgard_temp_tag }} from yruntime
        env:
          GH_TOKEN: ${{ secrets.YRUNTIME_TOKEN }}
          TAG: ${{ needs.checks.outputs.midgard_temp_tag }}
        run: |
          set -euo pipefail
          if gh api "repos/GNU-Ymir/yruntime/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh api -X DELETE "repos/GNU-Ymir/yruntime/git/refs/tags/${TAG}"
          fi
          echo "GNU-Ymir/yruntime ${TAG}: removed"

      # yruntime's release.yml, run on the branch: builds and tests midgard with the gyc just
      # published (the branch's YMIR_VERSION names it - checked by the checks job), tags the
      # version on the commit bundled here, and merges the branch's pull request. `sha` makes it
      # refuse to run if the branch has moved since, rather than tag a commit this gyc does not
      # carry.
      - name: Dispatch yruntime's release of midgard ${{ needs.checks.outputs.midgard_version }}
        if: ${{ needs.publish.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.YRUNTIME_TOKEN }}
          BRANCH: ${{ needs.checks.outputs.midgard_branch }}
          SHA: ${{ needs.checks.outputs.midgard_sha }}
          VERSION: ${{ needs.checks.outputs.midgard_version }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo GNU-Ymir/yruntime --ref "$BRANCH" -f sha="$SHA"
          echo "Dispatched GNU-Ymir/yruntime's release of ${VERSION} on ${BRANCH} @ ${SHA:0:7}: https://github.com/GNU-Ymir/yruntime/actions/workflows/release.yml" >> "$GITHUB_STEP_SUMMARY"
