name: Preview Release

# Rolling pre-release, manually triggered (pick the branch/ref from the "Run workflow" button).
# The tag/release name is the constant `preview`, independent of YMIR_VERSION's GYC_VERSION: every
# run replaces the previous preview, so there is only ever one preview tag and one preview
# release. The asset name is constant too (gyc-<major>_preview_amd64.deb), which keeps the
# download URL stable across runs. The name cannot collide with release.yml's bare <version> tags.
#
# The toolchain/bootstrap inputs are still pinned exactly as release.yml pins them (from
# YMIR_VERSION, bootstrap is still the value of truth and must still carry the GYC_VERSION tag) -
# only the *gymir frontend source* being previewed is rolling, since that's the ref this workflow
# was dispatched against.
#
# Split into five jobs (checks -> clone-gcc -> build-gyc -> build-midgard -> publish), same as
# release.yml, so a flaky/failing pass can be re-run on its own from the Actions UI without
# redoing the whole thing. See docker/Dockerfile.gyc and docker/Dockerfile.midgard for the build
# passes; clone-gcc only warms the `clone_gcc` layer so build-gyc resumes from the clone instead
# of redoing it. That layer (and every other) is kept by the shared persistent BuildKit builder
# from .github/actions/setup-buildx, on the runner's own disk - no cache-to/cache-from needed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: [self-hosted, linux, x64]
    outputs:
      gcc_version: ${{ steps.version.outputs.gcc_version }}
      gcc_major_version: ${{ steps.version.outputs.gcc_major_version }}
      ymir_bootstrap_version: ${{ steps.version.outputs.ymir_bootstrap_version }}
      gyc_release_tag: ${{ steps.version.outputs.gyc_release_tag }}
      gyc_asset: ${{ steps.version.outputs.gyc_asset }}
      gyllir_version: ${{ steps.version.outputs.gyllir_version }}
      gyllir_release_tag: ${{ steps.version.outputs.gyllir_release_tag }}
      gyllir_asset: ${{ steps.version.outputs.gyllir_asset }}
      midgard_version: ${{ steps.version.outputs.midgard_version }}
      bootstrap_tag: ${{ steps.version.outputs.bootstrap_tag }}
      gyc_package_version: ${{ steps.version.outputs.gyc_package_version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      intermediate_asset: ${{ steps.version.outputs.intermediate_asset }}
      out_asset: ${{ steps.version.outputs.out_asset }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute versions
        id: version
        run: |
          . ./YMIR_VERSION
          GCC_MAJOR_VERSION="${GCC_VERSION%%.*}"
          echo "gcc_version=${GCC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gcc_major_version=${GCC_MAJOR_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ymir_bootstrap_version=${YMIR_BOOTSTRAP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gyc_release_tag=${YMIR_BOOTSTRAP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gyc_asset=gyc-${GCC_MAJOR_VERSION}_${YMIR_BOOTSTRAP_VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"
          echo "gyllir_version=${GYLLIR_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gyllir_release_tag=${GYLLIR_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gyllir_asset=gyllir_${GYLLIR_VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"
          echo "midgard_version=${MIDGARD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "bootstrap_tag=${GYC_VERSION}" >> "$GITHUB_OUTPUT"
          # The .deb's dpkg `Version:` field, unlike the tag/asset name, cannot be the constant
          # `preview` - dpkg rejects a version that does not start with a digit. Stamp the
          # release this preview is heading towards, with a `~preview` suffix: the tilde sorts
          # *below* an empty suffix, so `1.2.0~preview` < `1.2.0` and apt upgrades a preview
          # install onto the real release once it ships (a `-preview` suffix would sort above it
          # and strand the preview as permanently "newer").
          echo "gyc_package_version=${GYC_VERSION}~preview" >> "$GITHUB_OUTPUT"
          echo "tag_name=preview" >> "$GITHUB_OUTPUT"
          echo "intermediate_asset=gyc-${GCC_MAJOR_VERSION}_preview_amd64.deb" >> "$GITHUB_OUTPUT"
          echo "out_asset=gyc-${GCC_MAJOR_VERSION}_preview_amd64.deb" >> "$GITHUB_OUTPUT"

      - name: Ensure bootstrap has a matching tag
        env:
          TAG: ${{ steps.version.outputs.bootstrap_tag }}
        run: |
          if ! git ls-remote --exit-code --tags https://github.com/GNU-Ymir/bootstrap.git "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::github.com/GNU-Ymir/bootstrap has no tag $TAG - tag that release on bootstrap (matching its gyllir.toml version) before previewing gymir."
            exit 1
          fi

  clone-gcc:
    name: "Pass 1: clone gcc"
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-buildx

      - name: Clone upstream gcc.gnu.org (cached independently of every version knob below it)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.gyc
          target: clone_gcc
          push: false

  build-gyc:
    name: "Pass 2: build gyc"
    needs: [checks, clone-gcc]
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-buildx

      - name: Build gyc .deb (no midgard yet)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.gyc
          target: export
          push: false
          load: true
          tags: gyc-preview-build:latest
          build-args: |
            GCC_VERSION=${{ needs.checks.outputs.gcc_version }}
            GCC_MAJOR_VERSION=${{ needs.checks.outputs.gcc_major_version }}
            COMPILER_MAJOR_VERSION=${{ needs.checks.outputs.gcc_major_version }}
            GYC_RELEASE_TAG=${{ needs.checks.outputs.gyc_release_tag }}
            GYC_ASSET=${{ needs.checks.outputs.gyc_asset }}
            GYLLIR_RELEASE_TAG=${{ needs.checks.outputs.gyllir_release_tag }}
            GYLLIR_ASSET=${{ needs.checks.outputs.gyllir_asset }}
            BOOTSTRAP_RELEASE_TAG=${{ needs.checks.outputs.bootstrap_tag }}
            MIDGARD_RELEASE_TAG=${{ needs.checks.outputs.midgard_version }}
            GYC_VERSION_NUMBER=preview
            GYC_PACKAGE_VERSION=${{ needs.checks.outputs.gyc_package_version }}

      - name: Extract .deb
        env:
          ASSET: ${{ needs.checks.outputs.intermediate_asset }}
        run: |
          CID="$(docker create gyc-preview-build:latest)"
          docker cp "${CID}:/${ASSET}" "./${ASSET}"
          docker rm "${CID}"

      - uses: actions/upload-artifact@v4
        with:
          name: gyc-preview-compiler-only-deb
          path: ${{ needs.checks.outputs.intermediate_asset }}
          retention-days: 3

  build-midgard:
    name: "Pass 3: build midgard, bundle final .deb"
    needs: [checks, build-gyc]
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: gyc-preview-compiler-only-deb
          path: artifacts

      - name: Stage the pass-1 .deb where Dockerfile.midgard expects it
        env:
          ASSET: ${{ needs.checks.outputs.intermediate_asset }}
        run: mv "artifacts/${ASSET}" artifacts/gyc.deb

      - uses: ./.github/actions/setup-buildx

      - name: Build final gyc+midgard .deb
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.midgard
          target: export
          push: false
          load: true
          tags: gyc-midgard-preview-build:latest
          build-args: |
            GCC_MAJOR_VERSION=${{ needs.checks.outputs.gcc_major_version }}
            MIDGARD_RELEASE_TAG=${{ needs.checks.outputs.midgard_version }}
            GYC_VERSION_NUMBER=preview
            GYC_PACKAGE_VERSION=${{ needs.checks.outputs.gyc_package_version }}

      - name: Extract final .deb
        env:
          ASSET: ${{ needs.checks.outputs.out_asset }}
        run: |
          CID="$(docker create gyc-midgard-preview-build:latest)"
          docker cp "${CID}:/${ASSET}" "./${ASSET}"
          docker rm "${CID}"

      - uses: actions/upload-artifact@v4
        with:
          name: gyc-preview-final-deb
          path: ${{ needs.checks.outputs.out_asset }}
          retention-days: 3

  publish:
    needs: [checks, build-midgard]
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7

      # The self-hosted runners have no gh CLI of their own; the release steps below need one.
      - uses: ./.github/actions/setup-gh

      - uses: actions/download-artifact@v4
        with:
          name: gyc-preview-final-deb
          path: .

      # The bootstrap tag this preview is pinned to is a real bootstrap release, so the changelog
      # is the same one release.yml publishes: bootstrap's changes since its previous release.
      # Only the gymir frontend source is rolling here, and it carries no version of its own.
      - name: Build release notes
        env:
          GCC_VERSION: ${{ needs.checks.outputs.gcc_version }}
          YMIR_BOOTSTRAP_VERSION: ${{ needs.checks.outputs.ymir_bootstrap_version }}
          GYLLIR_VERSION: ${{ needs.checks.outputs.gyllir_version }}
          MIDGARD_VERSION: ${{ needs.checks.outputs.midgard_version }}
          BOOTSTRAP_TAG: ${{ needs.checks.outputs.bootstrap_tag }}
        run: |
          set -euo pipefail

          CHANGELOG="${GITHUB_WORKSPACE}/.github/scripts/changelog.sh"
          CLONE="${RUNNER_TEMP}/bootstrap.git"

          # Bare + blobless: only the commit/tag metadata the changelog walks is needed, never a
          # worktree. The checks job already proved the tag is there.
          rm -rf "$CLONE"
          git clone --quiet --bare --filter=blob:none https://github.com/GNU-Ymir/bootstrap.git "$CLONE"

          # `${BOOTSTRAP_TAG}^`, not `${BOOTSTRAP_TAG}`: `git describe` of a tagged commit is that
          # tag itself, so describing its parent is what yields the *previous* release.
          BASE="$(cd "$CLONE" && bash "$CHANGELOG" --print-base --to "${BOOTSTRAP_TAG}^")"

          {
            echo "Automated preview release, built from \`${GITHUB_REF_NAME}\` against bootstrap tag ${BOOTSTRAP_TAG} (gcc ${GCC_VERSION}, compiled with gyc ${YMIR_BOOTSTRAP_VERSION} and gyllir ${GYLLIR_VERSION}, bundling midgard ${MIDGARD_VERSION}) @ ${GITHUB_SHA}."
            echo "This tag is rolling - it always points at the most recent preview build."
            echo
            if [ -n "$BASE" ]; then
              echo "## What's changed in bootstrap ${BOOTSTRAP_TAG} since ${BASE}"
            else
              echo "## What's changed in bootstrap ${BOOTSTRAP_TAG}"
            fi
            echo
            (cd "$CLONE" && bash "$CHANGELOG" --since "$BASE" --to "$BOOTSTRAP_TAG")
            if [ -n "$BASE" ]; then
              echo
              echo "**Full changelog**: https://github.com/GNU-Ymir/bootstrap/compare/${BASE}...${BOOTSTRAP_TAG}"
            fi
          } > "${RUNNER_TEMP}/release-notes.md"

          cat "${RUNNER_TEMP}/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Replace existing preview tag/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.checks.outputs.tag_name }}
        run: gh release delete "$TAG" --yes --cleanup-tag || true

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.checks.outputs.tag_name }}
          GCC_VERSION: ${{ needs.checks.outputs.gcc_version }}
          BOOTSTRAP_TAG: ${{ needs.checks.outputs.bootstrap_tag }}
          OUT_ASSET: ${{ needs.checks.outputs.out_asset }}
        run: |
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "Preview (gcc ${GCC_VERSION}, bootstrap ${BOOTSTRAP_TAG})" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --prerelease \
            "${OUT_ASSET}"
