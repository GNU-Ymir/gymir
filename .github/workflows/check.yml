name: Check

# Cheap pre-flight for the release workflows: verifies that every *remote* thing
# .github/workflows/release.yml and release-preview.yml reach for (through docker/Dockerfile.gyc
# and docker/Dockerfile.midgard) actually exists, before anyone spends an hour of self-hosted
# runner time on a full GCC compile only to have it die on a 404.
#
# Everything checked here is derived from YMIR_VERSION at the repo root - the single source of
# truth both release workflows read - so one run answers "is YMIR_VERSION releasable right now?":
#
#   YMIR_VERSION field     | must already exist on
#   -----------------------+---------------------------------------------------------------------
#   GYC_VERSION            | GNU-Ymir/bootstrap, as a tag - the self-hosted ymirc source
#                          |   Dockerfile.gyc checks out ("bootstrap is the value of truth")
#   YMIR_BOOTSTRAP_VERSION | GNU-Ymir/gymir, as a release carrying the prebuilt compiler asset
#                          |   gyc-<GCC major>_<version>_amd64.deb
#   GYLLIR_VERSION         | GNU-Ymir/Gyllir, as a release carrying gyllir_<version>_amd64.deb -
#                          |   the build tool that drives gyc (see Make-lang.in)
#   YMIR_BOOTSTRAP_        | GNU-Ymir/yruntime, as a release carrying libmidgard_debug_<version>.a
#     MIDGARD_VERSION      |   - the runtime of the stdlib the ymirc source is compiled against,
#                          |   which Dockerfile.gyc installs for ymir1 to link (see Make-lang.in)
#   GCC_VERSION            | gcc.gnu.org, as a releases/gcc-<major> branch
#
#   MIDGARD_BRANCH         | GNU-Ymir/yruntime, as a branch whose head is the midgard bundled into
#                          |   the final .deb - declaring a version that must *not* be tagged yet,
#                          |   building with GYC_VERSION's gyc, and with an open pull request
#                          |   (see .github/scripts/midgard-branch.sh)
#
# Checks after the first use `if: ${{ !cancelled() }}` so a single run reports *everything* that
# needs fixing instead of one thing per run, while each failing check still shows up red on its
# own step.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - YMIR_VERSION
      - docker/**
      - packaging/**
      - .github/**
  push:
    branches: [master]
    paths:
      - YMIR_VERSION
      - docker/**
      - packaging/**
      - .github/**

permissions:
  contents: read

jobs:
  preflight:
    name: "Preflight: remote refs named by YMIR_VERSION"
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7

      # The self-hosted runners have no gh CLI of their own; the release-asset steps need one.
      - uses: ./.github/actions/setup-gh

      # Exported to $GITHUB_ENV rather than step outputs: every step below reads them as plain
      # shell variables, which keeps the check scripts copy-pasteable into a local terminal.
      - name: Read YMIR_VERSION
        run: |
          set -euo pipefail
          . ./YMIR_VERSION

          missing=""
          for var in GYC_VERSION YMIR_BOOTSTRAP_VERSION YMIR_BOOTSTRAP_MIDGARD_VERSION GCC_VERSION GYLLIR_VERSION MIDGARD_BRANCH; do
            [ -n "${!var:-}" ] || missing="${missing} ${var}"
          done
          if [ -n "$missing" ]; then
            echo "::error::YMIR_VERSION does not set:${missing}"
            exit 1
          fi

          GCC_MAJOR_VERSION="${GCC_VERSION%%.*}"
          {
            echo "GYC_VERSION=${GYC_VERSION}"
            echo "YMIR_BOOTSTRAP_VERSION=${YMIR_BOOTSTRAP_VERSION}"
            echo "YMIR_BOOTSTRAP_MIDGARD_VERSION=${YMIR_BOOTSTRAP_MIDGARD_VERSION}"
            echo "GCC_VERSION=${GCC_VERSION}"
            echo "GCC_MAJOR_VERSION=${GCC_MAJOR_VERSION}"
            echo "GYLLIR_VERSION=${GYLLIR_VERSION}"
            echo "MIDGARD_BRANCH=${MIDGARD_BRANCH}"
            echo "GYC_ASSET=gyc-${GCC_MAJOR_VERSION}_${YMIR_BOOTSTRAP_VERSION}_amd64.deb"
            echo "GYLLIR_ASSET=gyllir_${GYLLIR_VERSION}_amd64.deb"
          } >> "$GITHUB_ENV"

          echo "Releasing GYC_VERSION=${GYC_VERSION} (gcc ${GCC_VERSION}), compiled with gyc"
          echo "${YMIR_BOOTSTRAP_VERSION} (against midgard ${YMIR_BOOTSTRAP_MIDGARD_VERSION}) + gyllir ${GYLLIR_VERSION}."

      # GYC_VERSION - the tag Dockerfile.gyc checks out in GNU-Ymir/bootstrap to get the ymirc
      # source that becomes ymir1. gymir and bootstrap release in lockstep, so this is the tag
      # this release is *also* published under here.
      - name: "bootstrap: tag ${{ env.GYC_VERSION }} exists"
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --tags https://github.com/GNU-Ymir/bootstrap.git "refs/tags/${GYC_VERSION}" >/dev/null 2>&1; then
            echo "::error::github.com/GNU-Ymir/bootstrap has no tag ${GYC_VERSION} - tag that release on bootstrap (matching its gyllir.toml version) before releasing gymir."
            exit 1
          fi
          echo "GNU-Ymir/bootstrap @ ${GYC_VERSION}: ok"

      # MIDGARD_BRANCH - the yruntime branch Dockerfile.midgard builds and bundles, and release.yml
      # then hands over to yruntime's own release. Same checks release.yml runs before it tags
      # anything. Exported for the summary below.
      - name: "yruntime: branch ${{ env.MIDGARD_BRANCH }} is releasable"
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          out="$(bash .github/scripts/midgard-branch.sh --branch="${MIDGARD_BRANCH}" --expect-gyc="${GYC_VERSION}" --mode=release)"
          printf '%s\n' "$out" >> "$GITHUB_ENV"
          eval "$out"
          echo "GNU-Ymir/yruntime ${MIDGARD_BRANCH} @ ${midgard_sha:0:7} declares ${midgard_version} (untagged), builds with gyc ${GYC_VERSION}, PR #${midgard_pr:-none}: ok"

      # What Dockerfile.gyc's `toolchain` stage curls: the two prebuilt .debs - the compiler that
      # does the compiling, and the tool that drives it - and the midgard runtime ymir1 links
      # (YMIR_BOOTSTRAP_MIDGARD_VERSION's, which that compiler's .deb need not carry). A release
      # existing is not enough - the build fetches one exact asset filename off it, so check the
      # asset (and that its download URL really serves bytes, which a release with a
      # still-uploading asset would not).
      - name: "gymir / Gyllir / yruntime: prebuilt toolchain is downloadable"
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          rc=0
          check_asset() {
            repo="$1"; tag="$2"; asset="$3"; field="$4"
            if ! assets="$(gh api "repos/${repo}/releases/tags/${tag}" --jq '.assets[].name' 2>/dev/null)"; then
              echo "::error::github.com/${repo} has no release tagged ${tag} (YMIR_VERSION's ${field}) - Dockerfile.gyc downloads ${asset} from it."
              return 1
            fi
            if ! printf '%s\n' "$assets" | grep -qxF "$asset"; then
              echo "::error::github.com/${repo} release ${tag} carries no asset named ${asset} (YMIR_VERSION's ${field}). Assets it does carry: $(printf '%s ' $assets)"
              return 1
            fi
            # The exact URL the Dockerfile curls. A one-byte range request validates the redirect
            # chain to the asset storage without pulling down the whole .deb.
            if ! curl -fsSL -r 0-0 -o /dev/null "https://github.com/${repo}/releases/download/${tag}/${asset}"; then
              echo "::error::github.com/${repo} release ${tag} lists ${asset} but its download URL does not serve - asset upload may be incomplete."
              return 1
            fi
            echo "${repo} @ ${tag} -> ${asset}: ok"
          }

          check_asset "GNU-Ymir/gymir" "${YMIR_BOOTSTRAP_VERSION}" "${GYC_ASSET}" "YMIR_BOOTSTRAP_VERSION/GCC_VERSION" || rc=1
          check_asset "GNU-Ymir/Gyllir" "${GYLLIR_VERSION}" "${GYLLIR_ASSET}" "GYLLIR_VERSION" || rc=1
          check_asset "GNU-Ymir/yruntime" "${YMIR_BOOTSTRAP_MIDGARD_VERSION}" "libmidgard_debug_${YMIR_BOOTSTRAP_MIDGARD_VERSION}.a" "YMIR_BOOTSTRAP_MIDGARD_VERSION" || rc=1
          exit "$rc"

      # GCC_VERSION's major - the upstream branch Dockerfile.gyc fetches and detaches onto after
      # its shallow clone of gcc.gnu.org.
      - name: "gcc.gnu.org: branch releases/gcc-${{ env.GCC_MAJOR_VERSION }} exists"
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          branch="releases/gcc-${GCC_MAJOR_VERSION}"

          # git:// (port 9418) is what Dockerfile.gyc itself clones over, so try it first; the
          # https:// endpoint is only a fallback for a runner that blocks the port, and it answers
          # 429 under load often enough that it cannot be the sole verdict.
          for url in "git://gcc.gnu.org/git/gcc.git" "https://gcc.gnu.org/git/gcc.git"; do
            if timeout 180 git ls-remote --exit-code --heads "$url" "refs/heads/${branch}" >/dev/null 2>&1; then
              echo "${url} -> ${branch}: ok"
              exit 0
            fi
            echo "::warning::could not resolve ${branch} via ${url}"
          done

          # Neither endpoint answered. That is either a wrong GCC_VERSION or an unreachable/
          # rate-limiting gcc.gnu.org, and those deserve very different verdicts - a preflight that
          # cries "bad version" every time upstream throttles is one nobody reads. Ask the GitHub
          # mirror, which carries the same releases/gcc-N branches, purely to tell the two apart.
          if timeout 180 git ls-remote --exit-code --heads https://github.com/gcc-mirror/gcc.git "refs/heads/${branch}" >/dev/null 2>&1; then
            echo "::warning::gcc.gnu.org is unreachable from this runner, but ${branch} does exist (confirmed via github.com/gcc-mirror/gcc), so GCC_VERSION ${GCC_VERSION} is fine. The release build clones gcc.gnu.org directly and will fail until it is reachable again."
            exit 0
          fi

          echo "::error::no ${branch} branch on gcc.gnu.org or github.com/gcc-mirror/gcc - GCC_VERSION (${GCC_VERSION}) in YMIR_VERSION does not name a released GCC series."
          exit 1

      # Advisory only. YMIR_VERSION is copied by hand from bootstrap/YMIR_VERSION at the
      # GYC_VERSION tag, so a stale copy is the likeliest way for these to disagree - but the
      # build only *needs* the tags checked above to resolve, so drift is a warning, not a
      # failure. MIDGARD_VERSION is deliberately excluded: Dockerfile.gyc overwrites bootstrap's
      # copy of it with this repo's value precisely because the two are allowed to drift.
      - name: "bootstrap: YMIR_VERSION agrees with this checkout"
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/GNU-Ymir/bootstrap/${GYC_VERSION}/YMIR_VERSION"
          if ! curl -fsSL -o /tmp/bootstrap_ymir_version "$url"; then
            echo "::warning::GNU-Ymir/bootstrap has no YMIR_VERSION at tag ${GYC_VERSION} - skipping the consistency comparison."
            exit 0
          fi

          for var in YMIR_BOOTSTRAP_VERSION GCC_VERSION GYLLIR_VERSION; do
            theirs="$(sed -nE "s/^${var}=(.*)/\1/p" /tmp/bootstrap_ymir_version | tail -n1)"
            ours="${!var}"
            if [ -z "$theirs" ]; then
              echo "::warning::bootstrap@${GYC_VERSION}'s YMIR_VERSION does not set ${var}"
            elif [ "$theirs" != "$ours" ]; then
              echo "::warning::${var} is ${ours} here but ${theirs} in bootstrap@${GYC_VERSION} - YMIR_VERSION is meant to only restate bootstrap's, re-copy it."
            else
              echo "${var}=${ours}: agrees with bootstrap@${GYC_VERSION}"
            fi
          done

          # YMIR_BOOTSTRAP_MIDGARD_VERSION restates the std bootstrap's gyllir.toml pins - the one
          # libymirc.a is really compiled against - so a drift here is a link against the wrong
          # runtime, the ABI mismatch Make-lang.in's YMIR_RUNTIME_LIBS comment describes.
          url="https://raw.githubusercontent.com/GNU-Ymir/bootstrap/${GYC_VERSION}/gyllir.toml"
          if ! curl -fsSL -o /tmp/bootstrap_gyllir_toml "$url"; then
            echo "::warning::GNU-Ymir/bootstrap has no gyllir.toml at tag ${GYC_VERSION} - skipping the YMIR_BOOTSTRAP_MIDGARD_VERSION comparison."
            exit 0
          fi
          theirs="$(sed -nE '/^\[std\]/,/^\[/ s/^version *= *"([^"]+)".*/\1/p' /tmp/bootstrap_gyllir_toml | head -n1)"
          if [ -z "$theirs" ]; then
            echo "::warning::bootstrap@${GYC_VERSION}'s gyllir.toml pins no [std] version"
          elif [ "$theirs" != "${YMIR_BOOTSTRAP_MIDGARD_VERSION}" ]; then
            echo "::warning::YMIR_BOOTSTRAP_MIDGARD_VERSION is ${YMIR_BOOTSTRAP_MIDGARD_VERSION} here but bootstrap@${GYC_VERSION}'s gyllir.toml pins std ${theirs} - ymir1 would link a runtime libymirc.a is not compiled against."
          else
            echo "YMIR_BOOTSTRAP_MIDGARD_VERSION=${YMIR_BOOTSTRAP_MIDGARD_VERSION}: agrees with bootstrap@${GYC_VERSION}'s [std] pin"
          fi

      # Advisory only: this is release.yml's own guard, run early. It is not a build-validity
      # problem (and it is expected to "fail" on master right after a release has shipped), so it
      # only warns - release.yml still refuses to overwrite.
      - name: "gymir: ${{ env.GYC_VERSION }} is not already released"
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${GYC_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::warning::${GYC_VERSION} has already been released on ${GITHUB_REPOSITORY} - release.yml will refuse to run until YMIR_VERSION's GYC_VERSION is bumped (from bootstrap)."
          elif git ls-remote --exit-code --tags origin "refs/tags/${GYC_VERSION}" >/dev/null 2>&1; then
            echo "::warning::tag ${GYC_VERSION} already exists on origin with no matching release - release.yml will refuse to run until YMIR_VERSION's GYC_VERSION is bumped."
          else
            echo "${GYC_VERSION} is free to release."
          fi

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          {
            echo "## Release preflight for \`${GYC_VERSION}\`"
            echo
            echo "| YMIR_VERSION | value | resolves to |"
            echo "| --- | --- | --- |"
            echo "| \`GYC_VERSION\` | ${GYC_VERSION} | [bootstrap@${GYC_VERSION}](https://github.com/GNU-Ymir/bootstrap/tree/${GYC_VERSION}) |"
            echo "| \`YMIR_BOOTSTRAP_VERSION\` | ${YMIR_BOOTSTRAP_VERSION} | [${GYC_ASSET}](https://github.com/GNU-Ymir/gymir/releases/download/${YMIR_BOOTSTRAP_VERSION}/${GYC_ASSET}) |"
            echo "| \`GYLLIR_VERSION\` | ${GYLLIR_VERSION} | [${GYLLIR_ASSET}](https://github.com/GNU-Ymir/Gyllir/releases/download/${GYLLIR_VERSION}/${GYLLIR_ASSET}) |"
            echo "| \`YMIR_BOOTSTRAP_MIDGARD_VERSION\` | ${YMIR_BOOTSTRAP_MIDGARD_VERSION} | [yruntime@${YMIR_BOOTSTRAP_MIDGARD_VERSION}](https://github.com/GNU-Ymir/yruntime/tree/${YMIR_BOOTSTRAP_MIDGARD_VERSION}) |"
            echo "| \`MIDGARD_BRANCH\` | ${MIDGARD_BRANCH} (midgard ${midgard_version:-?}) | [yruntime@${midgard_sha:0:7}](https://github.com/GNU-Ymir/yruntime/tree/${midgard_sha:-${MIDGARD_BRANCH}}) |"
            echo "| \`GCC_VERSION\` | ${GCC_VERSION} | gcc.gnu.org \`releases/gcc-${GCC_MAJOR_VERSION}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
